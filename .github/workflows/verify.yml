# Runs scripts/verify.sh (compile, unit tests, behaviour checks) on every pull
# request into develop or main. The job is named `verify`; make that check
# required in the branch rules so nothing merges without it passing.
name: verify

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify
        run: ./scripts/verify.sh
        env:
          CI: 'true'

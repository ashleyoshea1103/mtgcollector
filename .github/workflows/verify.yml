# Runs scripts/verify.sh (compile, unit tests, behaviour checks) on every pull
# request into develop or main, on every push to them (so merged results are
# checked too) and in merge queues. The job is named `verify`: the branch
# ruleset requires that check, from GitHub Actions, before anything merges.
name: verify

on:
  pull_request:
    branches: [develop, main]
    # `edited` re-runs the check when a pull request is retargeted to another base branch.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); the comment says which release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config where dependency or test code could read it.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify
        run: |
          node -e "console.log('Test locale:', Intl.DateTimeFormat().resolvedOptions().locale, JSON.stringify(new Intl.NumberFormat(undefined, { style: 'currency', currency: 'EUR' }).format(1.55)))"
          ./scripts/verify.sh
        env:
          CI: 'true'
          # Run under a locale whose prices look different from en-GB/en-US ("1,55 €",
          # with a non-breaking space), so locale assumptions in tests fail here.
          LC_ALL: de_DE.UTF-8
